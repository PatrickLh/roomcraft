[project]
name = "spike-b"
version = "0.1.0"
description = "Spike B：参考图生图布局保持 + 风格还原验证（独立脚本）"
requires-python = ">=3.12"
dependencies = [
    "roomcraft-server",
]

[tool.uv.sources]
roomcraft-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spike_b"]
